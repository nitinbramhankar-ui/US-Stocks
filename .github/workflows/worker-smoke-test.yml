name: Worker API smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: read
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Cloudflare deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const url = `https://api.github.com/repos/${process.env.GH_REPOSITORY}/commits/${process.env.GH_SHA}/check-runs`;
          const appearanceDeadline = Date.now() + 90 * 1000;
          let check = null;
          while (Date.now() < appearanceDeadline) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!response.ok) throw new Error(`GitHub check-runs API returned ${response.status}: ${await response.text()}`);
            const data = await response.json();
            check = (data.check_runs || []).find(x => x.name === "Workers Builds: us-stocks");
            if (check) break;
            console.log("No Cloudflare deployment check for this commit yet...");
            await sleep(15000);
          }
          if (!check) {
            console.log("No Cloudflare deployment was triggered by this commit; testing the currently deployed Worker.");
            process.exit(0);
          }
          const completionDeadline = Date.now() + 15 * 60 * 1000;
          while (Date.now() < completionDeadline) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!response.ok) throw new Error(`GitHub check-runs API returned ${response.status}: ${await response.text()}`);
            const data = await response.json();
            check = (data.check_runs || []).find(x => x.name === "Workers Builds: us-stocks");
            if (check?.status === "completed") {
              console.log(`Cloudflare deployment: ${check.conclusion}`);
              if (check.conclusion !== "success") throw new Error("Cloudflare deployment did not succeed");
              process.exit(0);
            }
            console.log("Waiting for Cloudflare Workers Build check to complete...");
            await sleep(15000);
          }
          throw new Error("Timed out waiting for Cloudflare deployment check");
          NODE

      - name: Test live Worker API
        env:
          WORKER_URL: https://us-stocks.nitinbramhankar.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.WORKER_URL;
          async function getJson(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(60000) });
            const body = await response.text();
            let data;
            try { data = JSON.parse(body); }
            catch { throw new Error(`${path}: HTTP ${response.status}; response was not JSON: ${body.slice(0, 500)}`); }
            if (!response.ok || data.ok !== true) {
              throw new Error(`${path}: HTTP ${response.status}: ${JSON.stringify(data).slice(0, 1200)}`);
            }
            return data;
          }

          const health = await getJson("/api/health");
          console.log("Health endpoint: PASS");
          if (!health.configuredSecrets?.SEC_USER_AGENT || !health.configuredSecrets?.FINNHUB_API_KEY) {
            throw new Error("Worker is missing one or more required production secrets");
          }
          console.log("Required production secrets: present");

          const revenue = await getJson("/api/revenue?symbol=NVDA");
          const quarters = revenue.quarters || [];
          if (quarters.length !== 5) {
            throw new Error(`NVDA revenue returned ${quarters.length} quarters; expected 5. Payload: ${JSON.stringify(revenue).slice(0, 1600)}`);
          }
          const latest = quarters[quarters.length - 1];
          if (!latest.end || !Number.isFinite(latest.revenue) || latest.revenue <= 0) {
            throw new Error(`Latest NVDA quarter is invalid: ${JSON.stringify(latest)}`);
          }
          const ageDays = (Date.now() - Date.parse(latest.end + "T00:00:00Z")) / 86400000;
          if (ageDays < -7 || ageDays > 120) {
            throw new Error(`Latest NVDA revenue period is stale or future-dated (${latest.end}; ${Math.round(ageDays)} days old)`);
          }
          console.log(`NVDA revenue endpoint: PASS — latest quarter ended ${latest.end}, revenue $${(latest.revenue / 1e9).toFixed(3)}B; 5 quarters returned`);
          NODE
